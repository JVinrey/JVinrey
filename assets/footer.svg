<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80" width="900" height="80">
  <defs>
    <style>
      .bg { fill: #0a0a0f; }
      .st { animation: twinkle 3s infinite alternate; }
      @keyframes twinkle {
        0%   { opacity: 0.1; }
        100% { opacity: 0.8; }
      }
      .col { font-family: 'Share Tech Mono', 'Courier New', monospace; font-size: 11px; fill: #00aaff; }
      .col-o { fill: #ff6b35; }
      .fall { animation: fall linear infinite; }
      @keyframes fall {
        0%   { transform: translateY(-20px); opacity: 0; }
        15%  { opacity: 0.7; }
        85%  { opacity: 0.3; }
        100% { transform: translateY(80px); opacity: 0; }
      }
      .quote {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 13px;
        fill: #555566;
      }
      .quote-hl { fill: #ff6b35; }
    </style>
    <radialGradient id="fog" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#001530" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="80" class="bg"/>
  <rect width="900" height="80" fill="url(#fog)"/>

  <!-- top divider -->
  <line x1="0" y1="1" x2="900" y2="1" stroke="#1a2040" stroke-width="1"/>

  <!-- Stars -->
  <circle class="st" cx="60"  cy="20" r="0.8" fill="white" style="animation-delay:0.3s"/>
  <circle class="st" cx="200" cy="10" r="1"   fill="white" style="animation-delay:1.1s"/>
  <circle class="st" cx="380" cy="30" r="0.7" fill="#aad4ff" style="animation-delay:0.7s"/>
  <circle class="st" cx="540" cy="15" r="0.9" fill="white" style="animation-delay:2.0s"/>
  <circle class="st" cx="700" cy="25" r="1"   fill="white" style="animation-delay:0.5s"/>
  <circle class="st" cx="830" cy="12" r="0.8" fill="#ffccaa" style="animation-delay:1.4s"/>

  <!-- Falling chars -->
  <text class="col fall" x="620" y="0" style="animation-duration:1.8s;animation-delay:0.2s">0</text>
  <text class="col fall" x="634" y="0" style="animation-duration:2.3s;animation-delay:0.8s">1</text>
  <text class="col col-o fall" x="648" y="0" style="animation-duration:1.5s;animation-delay:0.4s">*</text>
  <text class="col fall" x="662" y="0" style="animation-duration:2.6s;animation-delay:1.1s">0</text>
  <text class="col fall" x="676" y="0" style="animation-duration:1.9s;animation-delay:0.6s">1</text>
  <text class="col col-o fall" x="690" y="0" style="animation-duration:2.1s;animation-delay:1.5s">*</text>
  <text class="col fall" x="704" y="0" style="animation-duration:1.7s;animation-delay:0.9s">1</text>
  <text class="col fall" x="718" y="0" style="animation-duration:2.4s;animation-delay:0.3s">0</text>
  <text class="col fall" x="732" y="0" style="animation-duration:2.0s;animation-delay:1.3s">*</text>
  <text class="col col-o fall" x="746" y="0" style="animation-duration:1.6s;animation-delay:0.7s">1</text>

  <!-- Quote -->
  <text x="450" y="50" class="quote" text-anchor="middle">"Code from the </text>
  <text x="450" y="50" class="quote" text-anchor="middle">
    <tspan>"Code from the </tspan><tspan class="quote-hl">stars</tspan><tspan>, ship to the people"</tspan>
  </text>
</svg>
