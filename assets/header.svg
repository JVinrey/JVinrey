<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&amp;family=Share+Tech+Mono&amp;display=swap');

      .bg { fill: #0a0a0f; }
      .stars-static { fill: rgba(255,255,255,0.6); }

      /* Star twinkle */
      .st { animation: twinkle 3s infinite alternate; transform-origin: center; }
      .st:nth-child(2n)   { animation-duration: 2.1s; animation-delay: -0.5s; }
      .st:nth-child(3n)   { animation-duration: 4.3s; animation-delay: -1.2s; }
      .st:nth-child(5n)   { animation-duration: 1.8s; animation-delay: -2.1s; }
      .st:nth-child(7n)   { animation-duration: 3.6s; animation-delay: -0.9s; }
      @keyframes twinkle {
        0%   { opacity: 0.1; }
        100% { opacity: 0.9; }
      }

      /* Falling matrix chars */
      .col { font-family: 'Share Tech Mono', 'Courier New', monospace; font-size: 11px; fill: #00aaff; }
      .col-o { fill: #ff6b35; }

      .fall { animation: fall linear infinite; }
      @keyframes fall {
        0%   { transform: translateY(-40px); opacity: 0; }
        10%  { opacity: 1; }
        90%  { opacity: 0.3; }
        100% { transform: translateY(320px); opacity: 0; }
      }

      /* Nebula glow blobs */
      .neb1 { fill: rgba(0,100,255,0.07); }
      .neb2 { fill: rgba(255,80,0,0.05); }
      .neb3 { fill: rgba(100,0,200,0.06); }

      /* Name text */
      .name-first {
        font-family: 'Space Grotesk', 'Arial Black', sans-serif;
        font-size: 62px;
        font-weight: 700;
        fill: #ffffff;
        letter-spacing: -1px;
      }
      .name-last {
        font-family: 'Space Grotesk', 'Arial Black', sans-serif;
        font-size: 62px;
        font-weight: 700;
        fill: #ff6b35;
        letter-spacing: -1px;
      }
      .role {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 14px;
        fill: #aaaaaa;
      }
      .arrow { fill: #ff6b35; font-family: 'Share Tech Mono', monospace; font-size: 14px; }
      .role-hl { fill: #ffffff; font-family: 'Share Tech Mono', monospace; font-size: 14px; }
      .meta { font-family: 'Share Tech Mono', monospace; font-size: 11px; fill: #555566; }
      .dot { fill: #ff6b35; }

      /* scan line */
      .scan {
        stroke: rgba(0,180,255,0.08);
        stroke-width: 1;
        animation: scanmove 6s linear infinite;
      }
      @keyframes scanmove {
        0%   { transform: translateY(0px); opacity: 0; }
        10%  { opacity: 1; }
        90%  { opacity: 0.5; }
        100% { transform: translateY(320px); opacity: 0; }
      }

      /* glitch on name */
      .glitch {
        animation: glitch 8s infinite;
      }
      @keyframes glitch {
        0%, 92%, 100% { transform: translate(0,0); opacity: 1; }
        93%  { transform: translate(-3px, 1px); opacity: 0.8; }
        94%  { transform: translate(3px, -1px); opacity: 0.9; }
        95%  { transform: translate(-2px, 0px); opacity: 0.85; }
        96%  { transform: translate(0,0); opacity: 1; }
      }
    </style>

    <!-- nebula blobs -->
    <radialGradient id="neb1g" cx="70%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#003580" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2g" cx="20%" cy="70%" r="30%">
      <stop offset="0%" stop-color="#5500aa" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb3g" cx="85%" cy="80%" r="25%">
      <stop offset="0%" stop-color="#ff4400" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0"/>
    </radialGradient>
  </defs>

